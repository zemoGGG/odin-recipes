<!doctype html>
<html><head><title>Grandma's Biscuits</title></head>
<body>
<div itemscope itemtype="http://schema.org/Recipe">
  <h1 itemprop="name">Grandma's Buttermilk Biscuits</h1>
  <img itemprop="image" src="https://oldsite.example/biscuits.jpg" alt="">
  <p itemprop="description">Flaky, tall biscuits.</p>
  <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">Ruth</span></span>
  <meta itemprop="prepTime" content="PT15M">
  <time itemprop="cookTime" datetime="PT12M">12 minutes</time>
  <span itemprop="recipeYield">10 biscuits</span>
  <ul>
    <li itemprop="recipeIngredient">2 cups flour</li>
    <li itemprop="recipeIngredient">1 tbsp baking powder</li>
    <li itemprop="ingredients">3/4 cup <b>cold</b> buttermilk</li>
  </ul>
  <div itemprop="recipeInstructions">
    <p>Cut the butter into the flour.</p>
    <p>Stir in the buttermilk, pat out and cut.</p>
    <p>Bake at 450°F for 12 minutes.</p>
  </div>
</div>
</body></html>
